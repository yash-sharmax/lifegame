name: lifegame
description: "Life Game — habit tracker. Small steps, every day."
publish_to: 'none'
version: 2.11.2+25

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  fl_chart: ^0.69.0
  appwrite: ^28.3.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  connectivity_plus: ^7.0.0
  http: ^1.2.0
  http_parser: ^4.1.2
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon-source.jpg
